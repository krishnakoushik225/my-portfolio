<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#3b0f0f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <!-- ECG waveform -->
  <polyline points="40,170 100,170 120,130 140,210 160,100 180,240 200,170 240,170 260,150 280,190 300,170 560,170" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
  <!-- Grid lines -->
  <line x1="0" y1="170" x2="600" y2="170" stroke="#ef4444" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="130" x2="600" y2="130" stroke="#ef4444" stroke-width="0.5" opacity="0.1"/>
  <line x1="0" y1="210" x2="600" y2="210" stroke="#ef4444" stroke-width="0.5" opacity="0.1"/>
  <!-- Title -->
  <text x="300" y="60" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="monospace" letter-spacing="3" opacity="0.8">ECG · MEDICAL AI RESEARCH</text>
  <text x="300" y="265" text-anchor="middle" fill="white" font-size="22" font-weight="800" font-family="Arial, sans-serif">ECG-PEFT Benchmark</text>
  <text x="300" y="288" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="monospace" opacity="0.7">LoRA vs Adapter · 65K+ ECG Segments</text>
  <rect x="190" y="304" width="220" height="22" rx="5" fill="#ef4444" opacity="0.12" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="300" y="319" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="monospace">Wav2Vec2 · HuBERT · ECG-FM · PyTorch</text>
