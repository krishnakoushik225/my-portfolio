      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:0"/>
